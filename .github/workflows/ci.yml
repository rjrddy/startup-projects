name: project-checks
on: [push, pull_request, workflow_dispatch]
jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      projects: ${{ steps.list.outputs.projects }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: echo "projects=$(python -c 'import glob,json; print(json.dumps([p.rsplit("/",1)[0] for p in sorted(glob.glob("projects/*/Makefile"))]))')" >> "$GITHUB_OUTPUT"
  check:
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(needs.discover.outputs.projects) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m venv .venv && .venv/bin/pip install -r requirements.txt
      - run: make -C ${{ matrix.project }} lint test bench
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-${{ strategy.job-index }}
          path: ${{ matrix.project }}/evidence/

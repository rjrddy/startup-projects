name: arm-policy-gate
on:
  pull_request:
    paths: ['projects/r2-arm-regression-harness/**', '.github/workflows/robot-gate.yml']
  workflow_dispatch:
jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install mujoco
      - run: python src/harness.py --gate
        working-directory: projects/r2-arm-regression-harness
